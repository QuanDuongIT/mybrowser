services:
  - type: web
    name: flask-playwright
    env: python

    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /tmp/playwright

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      PLAYWRIGHT_BROWSERS_PATH=/tmp/playwright python -m playwright install chromium
      gunicorn app:app --timeout 120