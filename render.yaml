services:
  - type: web
    name: flask-playwright
    env: python
    plan: free

    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "false"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"

    buildCommand: |
      pip install -r requirements.txt
      playwright install --with-deps chromium

    startCommand: gunicorn app:app --timeout 120